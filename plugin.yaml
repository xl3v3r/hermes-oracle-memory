name: oracle
version: 1.0.9.2
description: "Oracle AI Database 26ai — VECTOR IVF, Oracle Text, fused hybrid recall, async batched embeddings, in-database chunking. v1.0.9.2 updates are CRITICAL to functionality. Clamps embedding text to 1200 characters, decouples ORA-54401/ORA-51815 shape errors from ONNX cooldown, lowers ONNX retry cooldown to 60s, implements fallback to text search during ONNX cooldown, and prevents silent turn loss on insert errors."
