name: "tests"

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.hermes-home == 'exported' && ', HERMES_HOME exported' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
        hermes-home: [unset]
        include:
          # One extra job with HERMES_HOME exported to a directory outside
          # the temp dir, as the Hermes Desktop shell does.
          - os: ubuntu-latest
            python-version: "3.13"
            hermes-home: exported
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "oracledb==26.1.0" "pytest==9.2.0"
      - name: Unit tests (no database; HOME sandboxed so nothing can touch a real ~/.hermes)
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          if [ "${{ matrix.hermes-home }}" = "exported" ]; then
            export HERMES_HOME="$RUNNER_TEMP/hermes-home"
            mkdir -p "$HERMES_HOME"
          else
            unset HERMES_HOME
          fi
          python -m pytest -q -p no:cacheprovider
      - name: Version drift check
        run: |
          v="$(cat VERSION)"
          grep -q "^version: ${v}$" plugin.yaml
          grep -q "^version = \"${v}\"" pyproject.toml
          grep -q "^__version__ = \"${v}\"" __init__.py
          test -f "RELEASE_NOTES_${v}.md"
