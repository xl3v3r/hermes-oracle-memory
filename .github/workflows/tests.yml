name: "tests"

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.hermes-home == 'exported' && ', HERMES_HOME exported' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
        hermes-home: [unset]
        include:
          # One extra job with HERMES_HOME exported to a directory outside
          # the temp dir, as the Hermes Desktop shell does.
          - os: ubuntu-latest
            python-version: "3.13"
            hermes-home: exported
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "oracledb==26.1.0" "pytest==9.2.0"
      # tests/test_sterile.py is part of this run: it fails when a dev-tool file
      # or a site-specific term is tracked again.
      - name: Unit tests (no database; HOME sandboxed so nothing can touch a real ~/.hermes)
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          if [ "${{ matrix.hermes-home }}" = "exported" ]; then
            export HERMES_HOME="$RUNNER_TEMP/hermes-home"
            mkdir -p "$HERMES_HOME"
          else
            unset HERMES_HOME
          fi
          python -m pytest -q -p no:cacheprovider
      - name: Version drift check
        run: |
          v="$(cat VERSION)"
          grep -q "^version: ${v}$" plugin.yaml
          grep -q "^version = \"${v}\"" pyproject.toml
          grep -q "^__version__ = \"${v}\"" __init__.py
          test -f "RELEASE_NOTES_${v}.md"

  # The wheel must carry what the provider loads at run time (scripts/ and the
  # bundled skills). Builds it, installs it into a clean environment and loads
  # the skill sync module from the installed package.
  package:
    name: wheel build and install check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Build the wheel and the sdist
        run: |
          python -m pip install "build==1.6.1"
          python -m build
          ls -l dist
      - name: Install the wheel into a clean environment and check it
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          cp tests/check_wheel.py "$RUNNER_TEMP/check_wheel.py"
          wheel="$(ls "$PWD"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" check_wheel.py "$wheel"

  # Bootstraps the memory table in an EMPTY schema of a real database and runs
  # one write and one search in each mode. The unit tests above mock the
  # driver, so only this job sees what the schema DDL does.
  database-smoke:
    name: database smoke test (Oracle AI Database Free, empty schema)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The "lite" image of Oracle AI Database 26ai Free, 23.26.4.0, by digest.
      ORACLE_IMAGE: container-registry.oracle.com/database/free@sha256:0d714311690f0481b49819ff6f35f756441ca165ad3d757c90a8e351fbf567da
      OCI_DB_DSN: 127.0.0.1:1521/FREEPDB1
      OCI_DB_USER: HERMES_SMOKE_USER
      HERMES_ORACLE_ONNX_MODEL: HERMES_SMOKE_EMBED
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install "oracledb==26.1.0" "pytest==9.2.0" "onnx==1.23.2"
      - name: Start the database (throwaway container, random passwords)
        run: |
          admin_pw="$(python -c 'import secrets; print("Hm" + secrets.token_hex(12) + "9a")')"
          user_pw="$(python -c 'import secrets; print("Hm" + secrets.token_hex(12) + "9a")')"
          echo "::add-mask::$admin_pw"
          echo "::add-mask::$user_pw"
          echo "SMOKE_DB_ADMIN_PASSWORD=$admin_pw" >> "$GITHUB_ENV"
          echo "OCI_DB_PASSWORD=$user_pw" >> "$GITHUB_ENV"
          docker run -d --name oracle-free -p 127.0.0.1:1521:1521 -e ORACLE_PWD="$admin_pw" "$ORACLE_IMAGE"
      - name: Wait for the database, create an empty schema, load the test embedding model
        run: python tests/smoke_db/prepare_database.py
      - name: Smoke test (bootstrap the schema, write, search in each mode, clean up)
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          python tests/verify_provider.py --strict
      - name: Second start on the same schema, through the opt-in pytest entry point
        run: |
          export HOME="$RUNNER_TEMP/home"
          HERMES_ORACLE_LIVE_TESTS=1 python -m pytest -q -p no:cacheprovider tests/test_provider_live.py tests/test_smoke_db_tools.py
      - name: Database log (on failure)
        if: failure()
        run: docker logs --tail 80 oracle-free || true
