[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-oracle-memory"
version = "1.1.1.5"
description = "Oracle AI Database 26ai memory provider plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [
    {name = "Taylor Ripley (xl3v3r)"}
]
dependencies = [
    "oracledb>=4.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# Only for scripts/setup_onnx_model.py: builds the embedding model's ONNX
# pipeline. A separate project (https://github.com/jasperan/onnx2oracle).
onnx = [
    "onnx2oracle>=0.1.1",
]

[tool.setuptools]
packages = ["hermes_oracle_memory"]
package-dir = {"hermes_oracle_memory" = "."}
include-package-data = false

# The provider loads scripts/sync_skills.py (and its helper) at run time, so
# the scripts are package data. Patterns name file types: a used checkout has
# __pycache__ directories that must not be packaged.
[tool.setuptools.package-data]
hermes_oracle_memory = ["plugin.yaml", "scripts/*.py", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
